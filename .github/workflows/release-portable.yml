name: Portable Windows release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download RIFE model
        shell: pwsh
        run: |
          $dest = "src/CornieKit.Looper/Models/rife_v425lite.onnx"
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          Invoke-WebRequest -Uri "https://huggingface.co/t9749/rife-4.25-lite-onnx/resolve/main/rife_v425lite.onnx" -OutFile $dest
          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash
          if ($hash -ne "702802D0862AB78F2D72133C6BC3768E7E89B81756F7CD51D1055A2FE3D06577") {
            throw "RIFE model hash mismatch: $hash"
          }

      - name: Confirm fxc.exe is available
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -match "x64" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $fxc) { throw "fxc.exe was not found. The pixel shader cannot be compiled." }
          Write-Host "fxc.exe: $($fxc.FullName)"

      - name: Build self-contained portable zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version.StartsWith("v")) { $version = $version.Substring(1) }
          ./Build-Release.ps1 -Version $version -SelfContained
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "CornieKit_Looper_${tag}_win-x64.zip"
          if (-not (Test-Path $zip)) { throw "Missing $zip" }
          foreach ($required in @(
            "publish\CornieKit.Looper.exe",
            "publish\hostfxr.dll",
            "publish\coreclr.dll",
            "publish\libvlc\win-x64\libvlc.dll",
            "publish\libvlc\win-x64\libvlccore.dll",
            "publish\Effects\VideoAdjust.ps",
            "publish\Models\rife_v425lite.onnx"
          )) {
            if (-not (Test-Path $required)) { throw "Missing $required" }
          }
          $shaderText = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes("publish\Effects\VideoAdjust.ps"))
          if ($shaderText -notmatch "TexelDelta") { throw "VideoAdjust.ps was not recompiled from VideoAdjust.fx (missing TexelDelta)." }
          if ($shaderText -match "DdyUV") { throw "VideoAdjust.ps still references DdyUV. fxc did not replace the patched shader." }
          Get-Item $zip, publish\CornieKit.Looper.exe, publish\Effects\VideoAdjust.ps | Format-List FullName, Length

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "CornieKit_Looper_${tag}_win-x64.zip"
          $notes = @"
          ## CornieKit Looper $tag

          Portable Windows build. No installer.

          ### Install
          1. Download ``$zip``
          2. Extract the zip
          3. Run ``CornieKit.Looper.exe``

          The .NET runtime is included in the zip. You do not need to install .NET separately.
          Requires 64-bit Windows 10 or Windows 11.

          ### Changes
          - **High frame rate loops.** While a segment repeats, the app builds a 2x RIFE smooth version in the background and keeps playing the original frames until it is ready. The smooth version is decoded ahead into memory and shown on the display refresh, then remembered after you quit. A lightning mark appears on that segment. Needs a DirectX 12 GPU. Without one, playback stays on the original frames.
          - **Clear invalid cache.** The top-left menu item 清除无效缓存 deletes smooth-loop caches whose video file is gone.
          - **Picture adjustments no longer ghost.** Sharpen, color temperature, and the other color controls no longer leave a double image or trail.
          - **Instant close.** Clicking the window X, Alt+F4, or Exit closes the app immediately.
          - **Starts muted.** Every video opens muted. Unmute restores your last audible level.

          ### Run
          Extract the zip and run ``CornieKit.Looper.exe``. There is no MSI, setup.exe, or other installer.
          "@
          $notes = $notes -replace "(?m)^          ", ""
          Set-Content -Path release-notes.md -Value $notes.Trim() -Encoding utf8
          gh release create $tag $zip --title "$tag - Smoother high frame rate loops" --notes-file release-notes.md
